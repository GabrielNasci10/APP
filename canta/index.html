<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canta a Palavra</title>
<meta name="theme-color" content="#1b1228">
<meta name="description" content="Jogo de festa: sorteia uma palavra e canta uma música que a tenha.">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Canta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: um palco de ecrã único — cabeçalho, disco de vinil com o anel do tempo, a palavra sorteada, comandos em baixo ao alcance do polegar */
:root{
  --stage:#1b1228;
  --stage-2:#2a1c3d;
  --vinyl:#0d0b11;
  --groove:#1d1924;
  --label:#ff7a45;
  --label-en:#46b6ff;
  --hot:#ff4f8b;
  --ink:#fbeee0;
  --muted:#b5a3c7;
  --line:rgba(251,238,224,.14);
  --display:"Shrikhand","Cooper Black","Georgia",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  margin:0;background:radial-gradient(120% 70% at 50% 38%,var(--stage-2),var(--stage) 70%);
  background-color:var(--stage);color:var(--ink);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.app{
  height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 16px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* Cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{margin:0;font-family:var(--display);font-weight:400;font-size:1.45rem;letter-spacing:.01em;line-height:1}
.brand b{color:var(--accent,var(--label));font-weight:400}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:800;font-size:.85rem;letter-spacing:.08em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--vinyl)}

/* Palco */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.disc-wrap{position:relative;width:min(68vw,36vh,300px);aspect-ratio:1;max-width:100%;flex:none}
.ring{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke .2s}
.ring.warn .fg{stroke:var(--hot)}
.disc{
  position:absolute;inset:0;border-radius:50%;border:0;padding:0;
  background:
    conic-gradient(from 30deg,transparent 0 12%,rgba(255,255,255,.10) 16%,transparent 22% 58%,rgba(255,255,255,.07) 62%,transparent 68%),
    repeating-radial-gradient(circle,var(--vinyl) 0 2px,var(--groove) 2px 3.5px);
  box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 6px var(--vinyl);
  display:grid;place-items:center;
}
.spin{animation:spin 1.8s linear infinite}
.spin.fast{animation-duration:.35s}
.spin .label{animation:spin 1.8s linear infinite reverse}
.spin.fast .label{animation-duration:.35s}
@keyframes spin{to{transform:rotate(360deg)}}
.label{
  width:38%;aspect-ratio:1;border-radius:50%;background:var(--accent);color:var(--vinyl);
  display:grid;place-content:center;gap:2px;position:relative;
}
.label-main{font-family:var(--display);font-size:clamp(1.1rem,6vw,1.7rem);line-height:1;font-variant-numeric:tabular-nums}
.label-sub{font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}

.prompt{margin:6px 0 0;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.word{
  margin:0;font-family:var(--display);font-weight:400;line-height:1.05;color:var(--ink);
  max-width:100%;overflow-wrap:anywhere;text-wrap:balance;min-height:1.1em;
  text-shadow:0 3px 0 rgba(0,0,0,.35);
}
.word.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}
.status{margin:0;min-height:1.3em;font-size:.95rem;color:var(--muted)}
.status.up{color:var(--hot);font-weight:800;font-size:1.1rem}
.history{margin:0;min-height:1.2em;font-size:.82rem;color:var(--muted);opacity:.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Comandos */
.controls{display:flex;flex-direction:column;gap:12px;flex:none}
.draw{
  border:0;border-radius:18px;padding:18px 20px;background:var(--accent);color:var(--vinyl);
  font-family:var(--display);font-size:1.6rem;line-height:1;
  box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;
}
.draw:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.draw:disabled{opacity:.7}
.timer{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.timer-label{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.timer button{
  flex:1;min-width:52px;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:9px 6px;
  font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--muted);
}
.timer button[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:rgba(255,255,255,.06)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.link{border:0;background:transparent;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.82rem}

@media (max-height:600px){.prompt{display:none}.disc-wrap{width:min(56vw,30vh)}.draw{padding:14px}}
@media (prefers-reduced-motion:reduce){.spin,.spin.fast,.spin .label{animation:none}.word.pop{animation:none}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <h1 class="brand">Canta a <b>Palavra</b></h1>
    <div class="lang" role="group" aria-label="Língua das palavras">
      <button id="lang-pt" type="button" aria-pressed="true">PT</button>
      <button id="lang-en" type="button" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="stage">
    <div class="disc-wrap" id="disc-wrap">
      <svg class="ring" id="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="bg" cx="50" cy="50" r="48"></circle>
        <circle class="fg" id="ring-fg" cx="50" cy="50" r="48" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
      </svg>
      <button class="disc" id="disc" type="button" aria-label="Contar o tempo">
        <span class="label"><span class="label-main" id="label-main">▶</span><span class="label-sub" id="label-sub">45 rpm</span></span>
      </button>
    </div>
    <p class="prompt" id="prompt">Canta uma música com</p>
    <h2 class="word" id="word" aria-live="polite">amor</h2>
    <p class="status" id="status"></p>
    <p class="history" id="history"></p>
  </section>

  <footer class="controls">
    <button class="draw" id="draw" type="button">Sortear</button>
    <div class="timer" role="group" aria-labelledby="timer-label">
      <span class="timer-label" id="timer-label">Tempo</span>
      <button id="t-0" type="button" data-s="0">∞</button>
      <button id="t-15" type="button" data-s="15">15s</button>
      <button id="t-30" type="button" data-s="30">30s</button>
      <button id="t-60" type="button" data-s="60">60s</button>
    </div>
    <div class="meta">
      <span id="count">1 de 200 palavras</span>
      <button class="link" id="reset" type="button">Recomeçar</button>
    </div>
  </footer>
</main>

<script>
const WORDS = {
  pt: [
    "amor","coração","saudade","mar","sol","lua","estrela","noite","dia","céu","chuva","vento",
    "fogo","água","terra","flor","rosa","jardim","praia","areia","onda","barco","rio","montanha",
    "cidade","rua","casa","janela","porta","estrada","caminho","viagem","comboio","avião","carro","bicicleta",
    "mãe","pai","filho","amigo","irmão","menina","menino","rapariga","rapaz","mulher","homem","rei",
    "rainha","princesa","anjo","diabo","paraíso","inferno","sonho","beijo","abraço","olhar","olhos","boca",
    "mãos","cabelo","sorriso","lágrima","chorar","cantar","dançar","correr","voar","sonhar","esperar","voltar",
    "partir","perder","ganhar","lembrar","esquecer","viver","morrer","dormir","acordar","fugir","saltar","tempo",
    "hora","amanhã","ontem","hoje","sempre","nunca","agora","verão","inverno","primavera","outono","manhã",
    "madrugada","festa","música","canção","guitarra","piano","tambor","rádio","telefone","carta","livro","fotografia",
    "espelho","vestido","sapatos","anel","ouro","dinheiro","branco","preto","azul","vermelho","verde","amarelo",
    "cor","luz","sombra","silêncio","voz","segredo","mentira","verdade","liberdade","guerra","paz","esperança",
    "medo","alegria","tristeza","felicidade","solidão","paixão","louco","bonita","linda","feliz","triste","sozinho",
    "juntos","longe","perto","mundo","vida","alma","corpo","sangue","pele","cão","gato","pássaro",
    "peixe","cavalo","leão","borboleta","árvore","folha","laranja","café","vinho","pão","chocolate","mel",
    "açúcar","fado","Lisboa","Portugal","Porto","ilha","navio","marinheiro","bandeira","escola","trabalho","domingo",
    "sábado","Natal","aniversário","casamento","igreja","sino","vela","neve","trovão","arco-íris","nuvem","oceano",
    "horizonte","planeta","telemóvel","televisão","cinema","futebol","bola","baile"
  ],
  en: [
    "love","heart","baby","night","day","sun","moon","star","sky","rain","fire","water",
    "ocean","sea","river","mountain","road","highway","city","street","home","house","door","window",
    "car","train","plane","boat","dance","sing","cry","smile","kiss","hug","eyes","lips",
    "hands","hair","face","body","soul","mind","dream","sleep","run","fly","fall","burn",
    "shine","break","hold","touch","feel","call","wait","remember","forget","lie","truth","money",
    "gold","diamond","king","queen","angel","devil","heaven","hell","prayer","church","wedding","ring",
    "party","music","song","radio","guitar","drum","piano","rock","summer","winter","spring","Christmas",
    "birthday","Friday","Saturday","Sunday","morning","tonight","tomorrow","yesterday","forever","never","always","time",
    "clock","young","wild","free","crazy","beautiful","sweet","cold","hot","happy","sad","lonely",
    "alone","together","friend","girl","boy","woman","man","mother","father","brother","sister","family",
    "red","blue","yellow","green","black","white","pink","light","dark","shadow","ghost","magic",
    "secret","fear","hope","faith","peace","war","freedom","power","hero","champion","game","ball",
    "phone","letter","picture","mirror","dress","shoes","hat","coffee","wine","whiskey","beer","candy",
    "sugar","honey","cherry","dog","cat","bird","horse","tiger","butterfly","tree","flower","rose",
    "garden","island","beach","wave","wind","storm","thunder","lightning","snow","ice","cloud","rainbow",
    "world","earth","planet","space","rocket","moonlight","sunshine","paradise","California","London","goodbye","hello",
    "sorry","tears","blood","bed","midnight","weekend","sunset","lucky"
  ]
};

const TEXT = {
  pt: {
    prompt: 'Canta uma música com', draw: 'Sortear', time: 'Tempo', reset: 'Recomeçar',
    count: (n, t) => `${n} de ${t} palavras`, sub: '45 rpm', disc: 'Contar o tempo',
    tapDisc: 'Toca no disco para contar o tempo', go: 'Encontra uma música e canta!',
    up: 'Tempo! Quem não cantou, passa a vez.', reshuffled: 'Já saíram todas. Baralhei de novo!',
    before: 'Antes: ', langLabel: 'Língua das palavras'
  },
  en: {
    prompt: 'Sing a song with', draw: 'Draw', time: 'Timer', reset: 'Restart',
    count: (n, t) => `${n} of ${t} words`, sub: '45 rpm', disc: 'Start the clock',
    tapDisc: 'Tap the record to start the clock', go: 'Find a song and sing it!',
    up: "Time's up! No song, lose your turn.", reshuffled: 'All words used. Reshuffled!',
    before: 'Before: ', langLabel: 'Word language'
  }
};

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('canta:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('canta:' + k, JSON.stringify(v)); } catch {} }
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const hot = window.claude?.hot?.data;
const state = {
  lang: hot?.lang ?? store.get('lang', 'pt'),
  seconds: hot?.seconds ?? store.get('seconds', 30),
  bags: hot?.bags ?? store.get('bags', { pt: [], en: [] }),
  history: hot?.history ?? store.get('history', { pt: [], en: [] }),
  word: hot?.word ?? null
};
let timer = null, endsAt = 0, shuffling = false, audio = null, wakeLock = null;

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// Saco baralhado por língua: nenhuma palavra repete até saírem todas.
function nextWord() {
  const lang = state.lang;
  let bag = (state.bags[lang] || []).filter(w => WORDS[lang].includes(w));
  let reshuffled = false;
  if (!bag.length) { bag = shuffled(WORDS[lang]); reshuffled = state.history[lang].length > 0; if (reshuffled) state.history[lang] = []; }
  const word = bag.pop();
  state.bags[lang] = bag;
  state.history[lang] = [word, ...state.history[lang]].slice(0, 200);
  store.set('bags', state.bags); store.set('history', state.history);
  return { word, reshuffled };
}

function fitWord(el, word) {
  const len = Math.max(word.length, 4);
  el.style.fontSize = `min(${Math.min(17, 105 / len).toFixed(2)}vw, ${Math.min(5.2, 30 / len).toFixed(2)}rem)`;
}

function showWord(word, pop) {
  const el = $('word');
  el.textContent = word;
  fitWord(el, word);
  if (pop && !reduceMotion) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

function renderMeta() {
  const t = TEXT[state.lang], total = WORDS[state.lang].length;
  const used = total - (state.bags[state.lang] || []).length;
  $('count').textContent = t.count(Math.min(used, total), total);
  const prev = state.history[state.lang].slice(1, 7);
  $('history').textContent = prev.length ? t.before + prev.join(' · ') : '';
}

function renderLang() {
  const t = TEXT[state.lang];
  document.documentElement.lang = state.lang === 'pt' ? 'pt-PT' : 'en';
  document.documentElement.style.setProperty('--accent', state.lang === 'pt' ? 'var(--label)' : 'var(--label-en)');
  $('lang-pt').setAttribute('aria-pressed', state.lang === 'pt');
  $('lang-en').setAttribute('aria-pressed', state.lang === 'en');
  document.querySelector('.lang').setAttribute('aria-label', t.langLabel);
  $('prompt').textContent = t.prompt;
  $('draw').textContent = t.draw;
  $('timer-label').textContent = t.time;
  $('reset').textContent = t.reset;
  $('label-sub').textContent = state.lang.toUpperCase() + ' · ' + t.sub;
  $('disc').setAttribute('aria-label', t.disc);
  renderMeta();
}

function renderTimerChoice() {
  document.querySelectorAll('.timer button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s === state.seconds));
}

function setRing(fraction) { $('ring-fg').setAttribute('stroke-dashoffset', (100 * (1 - fraction)).toFixed(2)); }

function stopTimer() {
  clearInterval(timer); timer = null;
  $('disc').classList.remove('spin');
  $('ring').classList.remove('warn');
}

function idleLabel() {
  stopTimer(); setRing(1);
  $('label-main').textContent = state.seconds ? '▶' : '♪';
  $('status').className = 'status';
  $('status').textContent = state.seconds ? TEXT[state.lang].tapDisc : TEXT[state.lang].go;
}

function startTimer() {
  stopTimer();
  if (!state.seconds) { $('label-main').textContent = '♪'; setRing(1); return; }
  endsAt = Date.now() + state.seconds * 1000;
  $('disc').classList.add('spin');
  $('status').className = 'status';
  $('status').textContent = TEXT[state.lang].go;
  const tick = () => {
    const left = Math.max(0, endsAt - Date.now());
    const s = Math.ceil(left / 1000);
    $('label-main').textContent = s;
    setRing(left / (state.seconds * 1000));
    $('ring').classList.toggle('warn', s <= 5);
    if (left <= 0) timeUp();
  };
  tick();
  timer = setInterval(tick, 100);
}

function timeUp() {
  stopTimer(); setRing(0);
  $('label-main').textContent = '0';
  $('status').className = 'status up';
  $('status').textContent = TEXT[state.lang].up;
  beep();
  try { navigator.vibrate?.([200, 100, 200]); } catch {}
}

function beep() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22, 0.44].forEach((at, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + at;
      o.type = 'triangle'; o.frequency.value = i === 2 ? 523 : 784;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 0.22);
    });
  } catch {}
}

async function keepAwake() {
  try { if (!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch {}
}

function draw() {
  if (shuffling) return;
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {}
  keepAwake();
  stopTimer();
  const { word, reshuffled } = nextWord();
  state.word = word;
  const finish = () => {
    shuffling = false;
    $('draw').disabled = false;
    $('disc').classList.remove('spin', 'fast');
    showWord(word, true);
    renderMeta();
    startTimer();
    if (reshuffled) { $('status').className = 'status'; $('status').textContent = TEXT[state.lang].reshuffled; }
  };
  if (reduceMotion) return finish();
  shuffling = true;
  $('draw').disabled = true;
  $('disc').classList.add('spin', 'fast');
  $('status').textContent = '';
  const pool = WORDS[state.lang];
  let n = 0;
  const roll = setInterval(() => {
    showWord(pool[Math.floor(Math.random() * pool.length)], false);
    if (++n >= 12) { clearInterval(roll); finish(); }
  }, 65);
}

function setLang(lang) {
  if (lang === state.lang || shuffling) return;
  state.lang = lang; store.set('lang', lang);
  renderLang();
  const { word } = nextWord();
  state.word = word;
  showWord(word, true);
  renderMeta();
  idleLabel();
}

function boot() {
  if (!WORDS[state.lang]) state.lang = 'pt';
  if (![0, 15, 30, 60].includes(state.seconds)) state.seconds = 30;
  state.bags = Object.assign({ pt: [], en: [] }, state.bags);
  state.history = Object.assign({ pt: [], en: [] }, state.history);
  renderLang();
  renderTimerChoice();
  if (!state.word) state.word = state.history[state.lang][0] || nextWord().word;
  showWord(state.word, false);
  renderMeta();
  idleLabel();

  $('draw').addEventListener('click', draw);
  $('disc').addEventListener('click', () => {
    if (shuffling) return;
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {}
    keepAwake();
    startTimer();
  });
  $('lang-pt').addEventListener('click', () => setLang('pt'));
  $('lang-en').addEventListener('click', () => setLang('en'));
  document.querySelectorAll('.timer button').forEach(b => b.addEventListener('click', () => {
    state.seconds = +b.dataset.s; store.set('seconds', state.seconds);
    renderTimerChoice(); idleLabel();
  }));
  $('reset').addEventListener('click', () => {
    state.bags[state.lang] = []; state.history[state.lang] = [];
    store.set('bags', state.bags); store.set('history', state.history);
    const { word } = nextWord(); state.word = word;
    showWord(word, true); renderMeta(); idleLabel();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && timer) keepAwake(); });
  window.claude?.hot?.snapshot?.(() => ({ lang: state.lang, seconds: state.seconds, bags: state.bags, history: state.history, word: state.word }));
}

boot();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
