/* =========================================================
   SINCRONIZAÇÃO ENTRE APARELHOS (Firebase)
   ========================================================= */
// Configuração do projeto Firebase. Não é secreta: o acesso aos dados é
// protegido pelas regras do Firestore (cada conta só lê e escreve os seus).
const FIREBASE_CONFIG = {
  apiKey: '',
  authDomain: '',
  projectId: '',
  appId: ''
};
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
const SYNC_META_KEY = 'stoa.sync.v1';
const SYNC_TYPES = {exams:'date', dichotomies:'id', goals:'id', todos:'id', notes:'id'};
const syncConfigured = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
const SYNC_LABELS = {
  off:'Sincronização não configurada', loading:'A ligar…', signedout:'Sessão não iniciada',
  busy:'A sincronizar…', ok:'Sincronizado', offline:'Sem ligação — as alterações ficam guardadas', error:'Erro de sincronização'
};
const sync = {fb:null, auth:null, db:null, user:null, status:syncConfigured ? 'loading' : 'off', error:'', lastSync:null,
  unsub:null, pushTimer:null, pushing:false, loading:null, inflight:{}, refreshPending:false, meta:loadSyncMeta()};

function loadSyncMeta() {
  try { const m = JSON.parse(localStorage.getItem(SYNC_META_KEY)); if (m && typeof m === 'object' && m.recs && typeof m.recs === 'object') return m; } catch {}
  return {uid:null, recs:{}};
}
function saveSyncMeta() { try { localStorage.setItem(SYNC_META_KEY, JSON.stringify(sync.meta)); } catch {} }
const docKey = (type, id) => `${type}__${String(id).replace(/[^\w-]/g, '_')}`.slice(0, 300);
const safeParse = s => { try { return JSON.parse(s); } catch { return null; } };

/* Cada registo (exame, meta, nota…) é um documento em users/{uid}/records/{chave}. */
function localRecords() {
  const m = new Map();
  for (const [type, k] of Object.entries(SYNC_TYPES)) for (const r of state[type]) m.set(docKey(type, r[k]), {type, data:r});
  m.set('meta__settings', {type:'settings', data:{name:state.settings.name}});
  m.set('meta__favorites', {type:'favorites', data:{favorites:state.favorites}});
  return m;
}

function syncErrorMsg(e) {
  const c = (e && e.code) || '';
  const map = {
    'auth/invalid-credential':'Email ou palavra-passe incorretos.', 'auth/wrong-password':'Email ou palavra-passe incorretos.',
    'auth/user-not-found':'Não existe nenhuma conta com esse email.', 'auth/invalid-email':'O email não é válido.',
    'auth/email-already-in-use':'Já existe uma conta com esse email. Usa «Entrar».', 'auth/weak-password':'A palavra-passe deve ter pelo menos 6 caracteres.',
    'auth/missing-password':'Escreve a palavra-passe.', 'auth/too-many-requests':'Demasiadas tentativas. Espera um pouco e tenta de novo.',
    'auth/network-request-failed':'Sem ligação à internet.', 'auth/operation-not-allowed':'O método Email/palavra-passe não está ativo no Firebase.',
    'auth/admin-restricted-operation':'A criação de novas contas está desativada.',
    'permission-denied':'Sem permissão no Firestore. Confirma as regras de segurança.', 'unavailable':'Serviço indisponível. Vou tentar de novo.'
  };
  return map[c] || (e && e.message) || 'Ocorreu um erro inesperado.';
}

function setSyncStatus(s, err = '') {
  if (s === 'busy' && !navigator.onLine) s = 'offline';
  sync.status = s; sync.error = err;
  updateSyncIndicators();
}
function updateSyncIndicators() {
  const side = $('#side-sync');
  if (side) {
    side.hidden = !syncConfigured;
    side.className = `side-sync s-${sync.status}`;
    side.innerHTML = `<span class="sync-dot"></span><span>${esc(sync.status === 'error' ? SYNC_LABELS.error : SYNC_LABELS[sync.status])}</span>`;
  }
  const line = $('#sync-status-line');
  if (line) line.innerHTML = syncStatusLine();
}
function syncStatusLine() {
  const t = sync.lastSync ? ` · última sincronização às ${fmtTime.format(new Date(sync.lastSync))}` : '';
  return `<span class="side-sync s-${sync.status}" style="padding:0"><span class="sync-dot"></span><span>${esc(SYNC_LABELS[sync.status])}${t}</span></span>${sync.error ? `<span class="muted" style="display:block;margin-top:6px">${esc(sync.error)}</span>` : ''}`;
}

async function initSync() {
  if (!syncConfigured) return;
  if (sync.loading) return sync.loading;
  setSyncStatus('loading');
  sync.loading = (async () => {
    try {
      const [app, auth, fs] = await Promise.all(['app', 'auth', 'firestore'].map(m => import(`${FIREBASE_SDK}firebase-${m}.js`)));
      sync.fb = {...app, ...auth, ...fs};
      const fbApp = app.initializeApp(FIREBASE_CONFIG);
      sync.auth = auth.getAuth(fbApp);
      sync.auth.languageCode = 'pt';
      sync.db = fs.getFirestore(fbApp);
      auth.onAuthStateChanged(sync.auth, onAuthChange);
    } catch (e) {
      console.warn('Sincronização indisponível:', e);
      sync.loading = null; sync.fb = null;
      setSyncStatus('offline', 'Não foi possível ligar ao serviço de sincronização. Volto a tentar quando houver internet.');
    }
  })();
  return sync.loading;
}

function onAuthChange(user) {
  if (sync.unsub) { sync.unsub(); sync.unsub = null; }
  clearTimeout(sync.pushTimer);
  sync.user = user || null;
  sync.inflight = {};
  if (!user) { setSyncStatus('signedout'); refreshSyncCard(); return; }
  if (sync.meta.uid !== user.uid) { sync.meta = {uid:user.uid, recs:{}}; saveSyncMeta(); }
  setSyncStatus('busy');
  const {collection, onSnapshot} = sync.fb;
  sync.unsub = onSnapshot(collection(sync.db, 'users', user.uid, 'records'), onRemoteSnapshot,
    e => setSyncStatus('error', syncErrorMsg(e)));
  refreshSyncCard();
}

function schedulePush(delay = 1500) {
  if (!sync.user) return;
  clearTimeout(sync.pushTimer);
  sync.pushTimer = setTimeout(pushChanges, delay);
}

/* Envia apenas o que mudou desde a última sincronização (e marcas de apagado). */
async function pushChanges() {
  if (!sync.user || !sync.db) return;
  if (sync.pushing) { schedulePush(); return; }
  const local = localRecords();
  const ops = [];
  for (const [key, r] of local) {
    const h = JSON.stringify(r.data);
    const m = sync.meta.recs[key];
    if (!m || m.d || m.h !== h) ops.push({key, type:r.type, h});
  }
  for (const [key, m] of Object.entries(sync.meta.recs)) {
    if (!m.d && !local.has(key)) ops.push({key, type:key.split('__')[0], h:null});
  }
  if (!ops.length) { if (sync.status === 'busy') setSyncStatus('ok'); return; }
  const uid = sync.user.uid;
  const {doc, writeBatch} = sync.fb;
  sync.pushing = true;
  setSyncStatus('busy');
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const chunk = ops.slice(i, i + 400);
      const u = Date.now();
      const batch = writeBatch(sync.db);
      chunk.forEach(op => {
        sync.inflight[op.key] = u;
        batch.set(doc(sync.db, 'users', uid, 'records', op.key),
          op.h === null ? {type:op.type, deleted:true, data:null, u} : {type:op.type, deleted:false, data:op.h, u});
      });
      await batch.commit();
      if (!sync.user || sync.user.uid !== uid) return;
      chunk.forEach(op => {
        sync.meta.recs[op.key] = op.h === null ? {u, d:true} : {u, h:op.h};
        if (sync.inflight[op.key] === u) delete sync.inflight[op.key];
      });
      saveSyncMeta();
    }
    sync.lastSync = Date.now();
    setSyncStatus('ok');
  } catch (e) {
    if (!navigator.onLine) setSyncStatus('offline'); else setSyncStatus('error', syncErrorMsg(e));
  } finally {
    sync.pushing = false;
  }
}

/* Aplica um registo vindo de outro aparelho ao estado local (no próprio objeto, para não quebrar editores abertos). */
function applyRemote(key, r) {
  if (r.type === 'settings' || r.type === 'favorites') {
    if (r.deleted) return false;
    const d = safeParse(r.data) || {};
    if (r.type === 'settings') { state.settings.name = str(d.name).slice(0, 60); sync.meta.recs[key] = {u:r.u, h:JSON.stringify({name:state.settings.name})}; }
    else { state.favorites = normalize({favorites:d.favorites}).favorites; sync.meta.recs[key] = {u:r.u, h:JSON.stringify({favorites:state.favorites})}; }
    return true;
  }
  const k = SYNC_TYPES[r.type];
  if (!k) return false;
  const arr = state[r.type];
  const idx = arr.findIndex(x => docKey(r.type, x[k]) === key);
  if (r.deleted) {
    if (idx >= 0) arr.splice(idx, 1);
    sync.meta.recs[key] = {u:r.u, d:true};
    return idx >= 0;
  }
  const parsed = safeParse(r.data);
  const rec = parsed && normalize({[r.type]:[parsed]})[r.type][0];
  if (!rec) return false;
  if (idx >= 0) { const cur = arr[idx]; Object.keys(cur).forEach(p => { if (!(p in rec)) delete cur[p]; }); Object.assign(cur, rec); }
  else arr.push(rec);
  sync.meta.recs[key] = {u:r.u, h:JSON.stringify(idx >= 0 ? arr[idx] : rec)};
  return true;
}

/* Primeira ligação deste aparelho: o registo existe aqui e na nuvem, sem histórico comum. */
function resolveFirstConflict(key, loc, r) {
  const remoteData = safeParse(r.data);
  if (r.type === 'settings') {
    const name = state.settings.name.trim() || str(remoteData && remoteData.name).slice(0, 60);
    state.settings.name = name;
    sync.meta.recs[key] = {u:r.u, h:r.data};
    return true;
  }
  if (r.type === 'favorites') {
    state.favorites = normalize({favorites:[...state.favorites, ...((remoteData && remoteData.favorites) || [])]}).favorites;
    sync.meta.recs[key] = {u:r.u, h:r.data};
    return true;
  }
  if (JSON.stringify(loc.data) === r.data) { sync.meta.recs[key] = {u:r.u, h:r.data}; return false; }
  const lu = loc.data.updatedAt || '', ru = (remoteData && remoteData.updatedAt) || '';
  if (ru && ru > lu) return applyRemote(key, r);
  // Fica a versão local; marca a da nuvem como conhecida para que a local seja enviada.
  sync.meta.recs[key] = {u:r.u, h:r.data};
  return false;
}

function onRemoteSnapshot(snap) {
  let changed = false;
  const local = localRecords();
  for (const change of snap.docChanges()) {
    if (change.type === 'removed') continue;
    const d = change.doc;
    if (d.metadata.hasPendingWrites) continue;
    const r = d.data();
    const key = d.id;
    if (!r || typeof r.u !== 'number') continue;
    if (sync.inflight[key] && sync.inflight[key] >= r.u) continue;
    const m = sync.meta.recs[key];
    if (m && m.u >= r.u) continue;
    const loc = local.get(key);
    if (!m && loc) {
      if (r.deleted) continue; // apagado noutro sítio antes de este aparelho se ligar: fica e volta a ser enviado
      if (resolveFirstConflict(key, loc, r)) changed = true;
      continue;
    }
    if (applyRemote(key, r)) changed = true;
  }
  saveSyncMeta();
  if (changed) { save(true); remoteRefresh(); }
  if (!snap.metadata.fromCache) { sync.lastSync = Date.now(); if (!sync.pushing) setSyncStatus('ok'); }
  schedulePush(300);
}

/* Atualiza o ecrã sem interromper quem está a escrever. */
function remoteRefresh() {
  updateSidebar();
  const ae = document.activeElement;
  const typing = !!(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.closest('#content'));
  if (route === 'notas') {
    renderNotesList();
    if (!typing || !state.notes.some(n => n.id === currentNoteId)) renderNoteEditor();
    return;
  }
  if (typing) { sync.refreshPending = true; return; }
  sync.refreshPending = false;
  rerender();
}
document.addEventListener('focusout', () => setTimeout(() => {
  if (!sync.refreshPending) return;
  const ae = document.activeElement;
  if (!(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) remoteRefresh();
}, 0));
window.addEventListener('online', () => { if (syncConfigured && !sync.fb) initSync(); else if (sync.user) { setSyncStatus('busy'); schedulePush(300); } });
window.addEventListener('offline', () => { if (sync.user) setSyncStatus('offline'); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && sync.user) schedulePush(300); });

/* Cartão da sincronização (Dados & Definições) */
function syncCardInner() {
  const head = `<div class="card-head"><h2 class="card-title">${icon('refresh')} Sincronização entre aparelhos</h2>${sync.user ? `<span class="badge badge-green">${icon('check')} Ligada</span>` : ''}</div>`;
  if (!syncConfigured) return head + `<p>A sincronização ainda não está configurada nesta versão da Stoa. Os dados ficam apenas neste aparelho.</p>`;
  if (!sync.fb) return head + `<p id="sync-status-line">${syncStatusLine()}</p>`;
  if (!sync.user) return head + `
    <p>Inicia sessão com a mesma conta no iPhone e no Mac: o que mudares num aparece no outro em segundos. Os dados que já tens neste aparelho são juntados aos da conta.</p>
    <div class="sync-form">
      <input class="input" id="sync-email" type="email" placeholder="Email" autocomplete="username" inputmode="email" autocapitalize="off">
      <input class="input" id="sync-pass" type="password" placeholder="Palavra-passe" autocomplete="current-password" data-enter="syncSignIn">
      <div class="row">
        <button class="btn btn-primary" data-action="syncSignIn">Entrar</button>
        <button class="btn" data-action="syncSignUp">Criar conta</button>
        <button class="btn btn-ghost btn-sm" data-action="syncReset">Esqueci-me da palavra-passe</button>
      </div>
    </div>
    <p id="sync-status-line" style="margin:14px 0 0;font-size:.82rem">${syncStatusLine()}</p>`;
  return head + `
    <p>Ligado como <b style="color:var(--text)">${esc(sync.user.email || 'conta sem email')}</b>. As alterações são enviadas automaticamente e chegam aos outros aparelhos em segundos.</p>
    <p id="sync-status-line" style="margin:0 0 16px;font-size:.82rem">${syncStatusLine()}</p>
    <div class="row">
      <button class="btn" data-action="syncNow">${icon('refresh')} Sincronizar agora</button>
      <button class="btn btn-ghost" data-action="syncSignOut">Terminar sessão</button>
    </div>`;
}
function refreshSyncCard() { const c = $('#sync-card'); if (c) c.innerHTML = syncCardInner(); updateSyncIndicators(); }

function syncCreds() {
  const email = ($('#sync-email')?.value || '').trim(), pass = $('#sync-pass')?.value || '';
  if (!email) { toast('Escreve o teu email.', 'warn'); $('#sync-email')?.focus(); return null; }
  if (!pass) { toast('Escreve a palavra-passe.', 'warn'); $('#sync-pass')?.focus(); return null; }
  return {email, pass};
}
async function syncAuthCall(el, fn, okMsg) {
  if (!sync.fb) { toast('O serviço de sincronização ainda não está disponível.', 'warn'); return; }
  const c = syncCreds(); if (!c) return;
  el.disabled = true;
  try { await fn(sync.auth, c.email, c.pass); toast(okMsg); }
  catch (e) { toast(syncErrorMsg(e), 'err', 5000); }
  finally { el.disabled = false; }
}
A.syncSignIn = el => syncAuthCall(el, sync.fb && sync.fb.signInWithEmailAndPassword, 'Sessão iniciada. A sincronizar…');
A.syncSignUp = el => {
  const c = syncCreds(); if (!c) return;
  if (c.pass.length < 6) { toast('A palavra-passe deve ter pelo menos 6 caracteres.', 'warn'); return; }
  syncAuthCall(el, sync.fb && sync.fb.createUserWithEmailAndPassword, 'Conta criada. A sincronizar…');
};
A.syncReset = async () => {
  const email = ($('#sync-email')?.value || '').trim();
  if (!email) { toast('Escreve primeiro o teu email.', 'warn'); $('#sync-email')?.focus(); return; }
  try { await sync.fb.sendPasswordResetEmail(sync.auth, email); toast('Enviei-te um email para redefinires a palavra-passe.'); }
  catch (e) { toast(syncErrorMsg(e), 'err', 5000); }
};
A.syncNow = () => { setSyncStatus('busy'); pushChanges(); };
A.syncSignOut = async () => {
  if (!await confirmDialog('Terminar sessão?', 'Os dados continuam neste aparelho, mas deixam de ser sincronizados até voltares a entrar.', 'Terminar sessão', false)) return;
  await sync.fb.signOut(sync.auth);
  sync.meta = {uid:null, recs:{}}; saveSyncMeta();
  toast('Sessão terminada.');
};

/* =========================================================
   ARRANQUE
   ========================================================= */
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY) return;
  state = load(); examForm = null;
  updateSidebar(); if (route !== 'notas') rerender();
});
$('#menu-btn').addEventListener('click', openSidebar);
$('#overlay').addEventListener('click', closeSidebar);
window.addEventListener('hashchange', navigate);

// Atualiza o Painel se a data mudar com a aplicação aberta
let lastDay = dateKey();
setInterval(() => {
  const k = dateKey();
  if (k !== lastDay) {
    lastDay = k; dashQuoteIdx = null;
    if (examForm && !state.examDraft && examForm.date !== k && !EXAM_Q.some(q => examForm[q.k].trim())) examForm = null;
    updateSidebar(); if (route === 'painel') renderDashboard();
  }
}, 60000);

buildChrome();
updateSidebar();
updateSyncIndicators();
navigate();
initSync();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
